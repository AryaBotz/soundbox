name = "soundbox-qris-backend"
main = "cloudflare/worker.js"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "soundbox-qris"
database_id = "e395fc82-05b9-40a3-9d45-f9af1092719e"
migrations_dir = "cloudflare/migrations"

[vars]
SIMULATOR_ENABLED = "true"
MIDTRANS_WEBHOOK_ENABLED = "true"
MIDTRANS_MODE = "sandbox"
MIDTRANS_ALLOWED_PAYMENT_TYPE = "qris"
MIDTRANS_ALLOWED_ACQUIRER = "gopay"
SONEXLABS_VOICE_ID = "clone:mayzuh02or"
